    # Version 2, qui évite le recours à Node :
      - name: Déclencher la notification et fermeture immédiate
        if: success() && (github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Création du ticket et récupération directe de son numéro
          ISSUE_NUM=$(gh issue create \
            --title "🚀 Workflow terminé : Image bonjour:latest poussée" \
            --body "Le workflow s'est terminé avec succès sur la branche main. L'image Docker a été envoyée vers GHCR et sera visible d'ici quelques instants." \
            --assignee "${{ github.actor }}")
          
          echo "Ticket créé. Attente de 15 secondes pour laisser le temps à la notification iOS d'arriver…"
          sleep 15   # 👈 CETTE PAUSE permet à iOS de traiter le push avant la fermeture

          # 2. Fermeture immédiate du ticket créé pour nettoyer le projet
          gh issue close "$ISSUE_NUM" --comment "Fermeture automatique du signal de notification."
