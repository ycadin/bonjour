name: Fabrique et pousse image Docker

on:
  push:
    branches: [ "main" ]   # Déclenche le build à chaque push sur la branche main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Donne le droit d'écrire dans GitHub Packages
      issues: write     # pour l'émission de notifications

    steps:
      - name: rapatriement du dépôt
        uses: actions/checkout@v7

      - name: connexion au dépôt de conteneurs
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Token automatique, rien à configurer !

      - name: extrait les metadonnées (tags, labels) pour Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: fabrique et pousse l'image
        uses: docker/build-push-action@v7
        with:
          context: .
#         file: ./un_dossier/MonDockerfile.prod   # si nom et/ou emplacement ≠ de Dockerfile à la racine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# ajout d'une tentative de notification pour ce workflow particulier :
